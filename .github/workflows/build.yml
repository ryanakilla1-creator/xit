name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip FreeFireAimbot.zip -d project
          ls -la project

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: project/FreeFireAimbot
        run: |
          chmod +x gradlew || true
          # create wrapper if missing
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2
          fi
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeFire-Aimbot-APK
          path: project/FreeFireAimbot/app/build/outputs/apk/debug/*.apk
